<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ENDT-TO-END — stupid runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="game-area">
    <header class="top">
      <div class="brand">ENDT-TO-END</div>
      <div class="score" id="score">0</div>
    </header>

    <canvas id="game-canvas" width="800" height="200" aria-label="Stupid runner game"></canvas>

    <div class="controls">
      <button id="btn-start">Start</button>
      <button id="btn-reset">Reset</button>
      <div class="hint">Space / Click / Tap to jump</div>
    </div>

    <footer class="msg" id="message">Run. Jump. Be stupider.</footer>
  </main>

  <script src="/script.js"></script>
</body>
</html>
